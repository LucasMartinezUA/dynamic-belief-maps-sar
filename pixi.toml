[workspace]
channels = ["conda-forge"]
name = "SAREnv"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.11.*"
geopandas = ">=1.1.2,<2"
rasterio = ">=1.4.4,<2"
osmnx = ">=2.0.7,<3"
shapely = ">=2.1.2,<3"
fiona = ">=1.10.1,<2"
tqdm = ">=4.67.3,<5"
statsmodels = ">=0.14.6,<0.15"

[pypi-dependencies]
sarenv = { path = ".", editable = true }
geopandas = "*"
matplotlib = "*"
osmnx = "*"
shapely = "*"
geopy = ">=2.4.1, <3"
pyproj = "*"
geojson = ">=3.2.0, <4"
colorama = ">=0.4.6, <0.5"
contextily = ">=1.7.0, <2"
pillow = "*"
scikit-image = ">=0.26.0, <0.27"
opencv-python = ">=4.13.0.92, <5"
plotly = ">=6.5.2, <7"
rasterio = "*"
elevation = ">=1.1.3, <2"
seaborn = ">=0.13.2, <0.14"
pytest = ">=9.0.3, <10"
